spring.application.name=covid-tracker

server.port=8080

# Load local credentials if the file exists
spring.config.import=optional:classpath:application-local.properties

# MySQL Database Configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/covid_tracker?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# COVID External API
covid.api.base-url=https://disease.sh/v3/covid-19

# Jackson
spring.jackson.serialization.write-dates-as-timestamps=false

# Logging
logging.level.com.covidtracker=INFO